<!DOCTYPE html>
<html>
<head>
    <title>College Information Form</title>
</head>
<body>
<h2>College Information Form</h2>
<form>
    <label>Student Name:</label>
    <input type="text" placeholder="Enter your name">
    <br><br>
    <label>Email:</label>
    <input type="email" placeholder="Enter your email">
    <br><br>
    <label>Course:</label>
    <select>
        <option>BCA</option>
        <option>BBA</option>
        <option>B.Com</option>
        <option>B.Sc</option>
    </select>
    <br><br>
    <label>College Image:</label><br>
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcScm1UIiclcYxttNWoX3Be2vaMn85xoUYh_LCGgNFbnew&s=10" width="300" height="150">
    <br><br>
    <label>College Video:</label><br>
    <video width="250" controls>
        <source src="https://encrypted-vtbn0.gstatic.com/video?q=tbn:ANd9GcRZbuA-vMhXNXlwmgMuCtnL2eQJ50cNDt494Q" type="video/mp4">
    </video>
    <br><br>
    <label>College Audio:</label><br>
    <audio controls>
        <source src="college.mp3" type="audio/mpeg">
    </audio>
    <br><br>
    <input type="submit" value="Submit">
    <input type="reset" value="Clear">
</form>
</body>
</html>
