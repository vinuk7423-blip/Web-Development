<!DOCTYPE html>
<html>
<head>
    <title>Lists</title>
</head>
<body>
    <h1>My Favorite Subjects</h1>
    <h2>Unordered List</h2>
    <ul>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>HTML</li>
    </ul>
    <h2>Ordered List</h2>
    <ol>
        <li>Learn CSS</li>
        <li>Learn JavaScript</li>
        <li> Learn HTML</li>
    </ol>
    <h2>Description List</h2>
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language.
            Used to create webpage structure.</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets.
            Used to style webpages.</dd>
    </dl>
</body>
</html>
